}

<script>
(function () {
  var loader = document.getElementById('dalil-loader');
  if (!loader) return;
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FADE_AT = reduced ? 1200 : 3000;   // the loader stays 3 s, then fades out in 0.5 s
  var started = Date.now(), ready = false, closed = false, timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  // Background: slow network of particles. It stops for good when the loader closes.
  var canvas = document.getElementById('bgCanvas');
  var raf = 0, onResize = null;
  if (canvas && !reduced) {
    var ctx = canvas.getContext('2d'), W = 0, H = 0, ps = [];
    var size = function () { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
    size(); onResize = size; window.addEventListener('resize', onResize);
    var n = Math.min(80, Math.floor((W * H) / 15000));
    for (var i = 0; i < n; i++) ps.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4, r: Math.random() * 1.5 + .5, a: Math.random() * .3 + .1 });
    var frame = function () {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < ps.length; i++) {
        var p = ps[i]; p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fillStyle = 'rgba(77,208,196,' + p.a + ')'; ctx.fill();
        for (var j = i + 1; j < ps.length; j++) {
          var dx = p.x - ps[j].x, dy = p.y - ps[j].y, d = Math.sqrt(dx * dx + dy * dy);
          if (d < 120) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(ps[j].x, ps[j].y); ctx.strokeStyle = 'rgba(77,208,196,' + (.08 * (1 - d / 120)) + ')'; ctx.lineWidth = .5; ctx.stroke(); }
        }
      }
      raf = requestAnimationFrame(frame);
    };
    frame();

  // A burst of particles when the eye lights up.
  later(function () {
    if (closed || reduced) return;
    var box = document.getElementById('burstContainer');
    for (var i = 0; i < 40; i++) {
      var p = document.createElement('div');
      p.className = 'burst';
      var ang = (Math.PI * 2 / 40) * i + (Math.random() - .5) * .5, dist = 60 + Math.random() * 100;
      var dur = .6 + Math.random() * .6, sz = 2 + Math.random() * 3;
      p.style.width = sz + 'px'; p.style.height = sz + 'px';
      p.style.background = Math.random() > .7 ? '#f5c542' : '#4dd0c4';
      box.appendChild(p);
      (function (p, tx, ty, dur) {
        requestAnimationFrame(function () {
          p.style.transition = 'all ' + dur + 's cubic-bezier(.2,.8,.3,1)';
          p.style.opacity = '.8';
          p.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';

    { text: 'Getting your languages ready\u2026', delay: 1000, dur: 350 },
