      - id: appointment_letter_required
        statement: Under the Bangladesh Labour Act an employer may not employ a worker without first giving an appointment letter, and every worker must be given a photo identity card.
        source_url: "https://bdlaws.minlaw.gov.bd/act-952/section-29073.html"
        quote: "কোন মালিক নিয়োগপত্র প্রদান না করিয়া কোন শ্রমিককে নিয়োগ করিতে পারিবেন না"
        confidence: quoted
        verified_on: 2026-10-11
      - id: labour_act_covers_overtime_wages
        statement: The Labour Act has separate sections on overtime allowance, time for payment of wages and probation, but the rates and periods in them were not read.
        source_url: "https://bdlaws.minlaw.gov.bd/act-952.html"
        quote: ""
        confidence: summary
        verified_on: 2026-10-11
      - id: bmet_overseas_employment
        statement: BMET is the government body set up to arrange employment abroad for Bangladeshi workers and to meet domestic manpower needs.
        source_url: "https://probashi.gov.bd/pages/static-pages/6940329e35ce18e1c055f6cf"
