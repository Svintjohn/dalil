notes: "Thin file: most official Bangladesh pages blocked the fetch tool (robots or redirect loops), so only three facts are confirmed. Blocked or unreadable: bmet.gov.bd (home, contact, notices), dncrp.gov.bd (consumer hotline 16121 appeared in a search result title but no page was opened, so it is not stated), bdlaws.minlaw.gov.bd pages for labour act sections on overtime, wage payment and termination, the Consumer Rights Protection Act 2009, the Cyber Protection Act 2026, and police.gov.bd gave no hotline. NOT covered: tenancy, recruitment fees and complaints against recruiting agencies under the overseas employment law, passport retention, domestic workers (the Labour Act's coverage of domestic workers was not checked), fines, consumer, scams and privacy. The BGD e-GOV CIRT site (cirt.gov.bd) takes incident reports from institutions; whether individuals can use it was not confirmed. A Bangladesh mission page (canberra.mofa.gov.bd) says work permit verification for workers in Australia goes through BMET; not generalised."
