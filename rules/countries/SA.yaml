country: SA
name: Saudi Arabia
last_verified: 2026-10-10
portal: {name: Unified National Platform (my.gov.sa), url: https://my.gov.sa/en}
official_domains: [my.gov.sa, hrsd.gov.sa, ejar.sa, mc.gov.sa, sama.gov.sa]
authorities:
  - id: hrsd
    name: Ministry of Human Resources and Social Development
    url: https://www.hrsd.gov.sa/en
    covers: [employment]
    phone: "19911"
    phone_source: https://my.gov.sa/en/content/employment
  - id: ejar
    name: Ejar (tenancy contract registration platform)
    url: https://www.ejar.sa/en/faqs
    covers: [tenancy]
  - id: mci
    name: Ministry of Commerce
    url: https://mc.gov.sa/en
    covers: [consumer]
    phone: "1900"
    phone_source: https://mc.gov.sa/en/mediacenter/News/Pages/17-03-19-01.aspx
  - id: sama
    name: Saudi Central Bank (SAMA)
    url: https://www.sama.gov.sa/en-US/MediaCenter/News/pages/news-622.aspx
