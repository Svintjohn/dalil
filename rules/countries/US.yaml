    sources:
      - {url: https://consumer.ftc.gov/articles/how-recognize-and-avoid-phishing-scams, title: How to recognize and avoid phishing scams, publisher: Federal Trade Commission, language: en}
    facts:
      - id: report_phishing_ftc
        statement: Phishing attempts can be reported to the FTC at ReportFraud.ftc.gov.
        source_url: https://consumer.ftc.gov/articles/how-recognize-and-avoid-phishing-scams
        quote: "Report the phishing attempt to the FTC at ReportFraud.ftc.gov."
        confidence: quoted
        verified_on: 2026-10-11
      - id: forward_spam_texts_7726
        statement: Phishing text messages can be forwarded to 7726 (SPAM).
        source_url: https://consumer.ftc.gov/articles/how-recognize-and-avoid-phishing-scams
        quote: ""
        confidence: summary
        verified_on: 2026-10-11
  tenancy:
    sources:
      - {url: https://www.hud.gov/states/montana, title: HUD Montana page with tenant rights links, publisher: HUD, language: en}
    facts:
      - id: tenant_rights_via_state_pages
        statement: HUD's state pages link to each state's own tenant rights and eviction resources, because landlord and tenant rules are set mostly at state level.
        source_url: https://www.hud.gov/states/montana
        quote: ""
        confidence: summary
        verified_on: 2026-10-11
notes: "The US is federal: tenancy (deposits, notice, eviction) and most wage-payment rules are set by each state, so no national deposit or notice rule is recorded. For tenancy see HUD state pages at hud.gov/states/<state-name>, and for state labor rules see the Department of Labor list of state labor offices (https://www.dol.gov/agencies/whd/state/contacts). The statement in tenant_rights_via_state_pages that rules are set mostly at state level is an inference from HUD linking to state resources; the HUD page did not say it in those words. The FTC Cooling-Off Rule page opened lists a 25 dollar threshold and a 2012 proposal to raise it to 130 dollars without saying whether it was adopted, so the threshold is not recorded. When opened, reportfraud.ftc.gov displayed a notice that the service was unavailable because of a government shutdown, so its status should be rechecked. Gaps: fines, immigration documents beyond the trafficking page, privacy (no comprehensive federal law page confirmed), written-contract and probation rules, rent increase and notice. The pages consumer.ftc.gov cooling-off articles and hud.gov tenantrights for Maine could not be read."
