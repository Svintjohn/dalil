      - {url: https://www.dol.gov/agencies/whd/state/payday, title: State payday requirements, publisher: US Department of Labor, language: en}
      - {url: https://www.dol.gov/general/migrantworker/trafficking, title: Trafficking, publisher: US Department of Labor, language: en}
    facts:
      - id: federal_minimum_wage
        statement: The federal minimum wage is 7.25 dollars per hour, in effect since 24 July 2009.
        source_url: https://www.dol.gov/agencies/whd/flsa
        quote: "The federal minimum wage is $7.25 per hour effective July 24, 2009."
        confidence: quoted
        verified_on: 2026-10-11
      - id: overtime_after_40_hours
        statement: Covered employees who are not exempt must be paid overtime at not less than one and one-half times their regular rate for hours worked over 40 in a workweek.
        source_url: https://www.dol.gov/agencies/whd/overtime
        quote: ""
        confidence: summary
        verified_on: 2026-10-11
      - id: employer_time_pay_records
        statement: Employers must keep time and pay records for their employees.
        source_url: https://www.dol.gov/agencies/whd/flsa
        quote: "Employers must also keep employee time and pay records."
        confidence: quoted
        verified_on: 2026-10-11
      - id: state_minimum_wage_may_be_higher
        statement: States set their own minimum wages, and where a state rate is higher than the federal one the higher state rate generally applies; where a state has no minimum wage law, employers covered by the federal law must pay the federal rate.
        source_url: https://www.dol.gov/agencies/whd/minimum-wage/state
        quote: ""
        confidence: summary
        verified_on: 2026-10-11
      - id: payday_set_by_state
        statement: How often wages must be paid is set mostly by state law, so pay frequency differs from state to state and the state labor office is the place to check.
        source_url: https://www.dol.gov/agencies/whd/state/payday
        quote: ""
        confidence: summary
        verified_on: 2026-10-11
      - id: wage_complaint_whd
        statement: Wage complaints can be made to the Department of Labor Wage and Hour Division on 1-866-487-9243; complaints are confidential and employers may not retaliate against workers who file one.
        source_url: https://www.dol.gov/agencies/whd/contact/complaints
        quote: ""
        confidence: summary
        verified_on: 2026-10-11
      - id: employer_should_not_hold_documents
        statement: An employer should not hold a worker's identity documents or passport, and doing so can be a sign of labor trafficking.
        source_url: https://www.dol.gov/general/migrantworker/trafficking
        quote: "Your employer should not hold on to your documents."
        confidence: quoted
        verified_on: 2026-10-11
      - id: trafficking_hotline
        statement: The National Human Trafficking Hotline is free, runs 24 hours a day on 1-888-373-7888, and can be texted at 233733 with the word BeFree.
        source_url: https://www.dol.gov/general/migrantworker/trafficking
        quote: ""
        confidence: summary
        verified_on: 2026-10-11
  consumer:
    sources:
      - {url: https://www.ftc.gov/legal-library/browse/rules/cooling-period-sales-made-home-or-other-locations, title: Cooling-off period for sales made at home or other locations, publisher: Federal Trade Commission, language: en}
    facts:
      - id: cooling_off_door_to_door
        statement: Under the FTC Cooling-Off Rule a buyer has the right to cancel a door-to-door sale, or a sale made at certain other non-store locations, within three business days, and the seller must tell the buyer about this right.
        source_url: https://www.ftc.gov/legal-library/browse/rules/cooling-period-sales-made-home-or-other-locations
        quote: ""
        confidence: summary
        verified_on: 2026-10-11
